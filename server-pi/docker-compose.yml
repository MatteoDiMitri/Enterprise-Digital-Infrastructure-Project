services:

  web:
    build: ./web
    ports:
      - "80:80"
    # --- AGGIUNGI QUESTE DUE RIGHE ---
    env_file:
      - .env
    # ---------------------------------
    environment:
      # DDoS rate-limit gate (api/_prepend.php). Attivo SOLO durante lo
      # scenario ddos: oltre questo numero di richieste/secondo il server
      # risponde 503, così error_rate supera il 2% e il donut mostra i 5xx.
      # 0 o assente = gate spento. Parti da 100; abbassa a 50 per piu' errori.
      - NEXUS_RATELIMIT_RPS=100
    volumes:
      - ./web/html:/var/www/html
      - shared_tmp:/tmp
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: always
    environment:
      # Read passwords from the .env file via environment substitution
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: edi_project
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --max_connections=500
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9091:9090"  # Prometheus available on host port 9091 (container:9090)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus

  dashboard-backend:
    image: python:3.11-slim
    ports:
      - "8881:8081"
    volumes:
      - ./backend/dashboard-server.py:/app/dashboard-server.py
      - shared_tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    depends_on:
      - prometheus
    command: >
      bash -c "pip install docker && python3 dashboard-server.py"

  cpu-load:
    image: python:3.11-slim
    restart: unless-stopped
    volumes:
      - ./scenario_cpu_load.py:/app/scenario_cpu_load.py
      - shared_tmp:/tmp
    working_dir: /app
    environment:
      - NEXUS_SCENARIO_FILE=/tmp/nexus_active_scenario.json
      - NEXUS_BURN_DUTY=0.85
      - NEXUS_BURN_SCENARIO=ddos
    command: ["python3", "scenario_cpu_load.py"]
    depends_on:
      - web

  saturation-load:
    image: python:3.11-slim
    restart: unless-stopped
    volumes:
      - ./scenario_cpu_load.py:/app/scenario_cpu_load.py
      - shared_tmp:/tmp
    working_dir: /app
    environment:
      - NEXUS_SCENARIO_FILE=/tmp/nexus_active_scenario.json
      - NEXUS_BURN_DUTY=0.85
      - NEXUS_BURN_SCENARIO=saturation
    command: ["python3", "scenario_cpu_load.py"]
    depends_on:
      - web

volumes:
  db_data:
  prom_data:
  shared_tmp:
