# server-pi/web/apache/nexus.conf
# ================================
# OPTIONAL Apache tuning for the NEXUS demo. NOT copied into the image by
# default — see web/Dockerfile for the (commented) COPY + a2enconf lines.
#
# Why you might want this
# -----------------------
# The php:8.4-apache image uses mpm_prefork with a default MaxRequestWorkers
# of ~150. On a Raspberry that is both (a) more than the Pi can comfortably
# serve and (b) the reason the front layer never "saturates" in a visible
# way: it happily serves whatever the (reduced) load throws at it, so DDoS /
# Flash Crowd throughput just climbs instead of plateauing.
#
# Capping the worker pool gives the textbook front-layer signature:
#   - throughput PLATEAUS at a known ceiling (workers × requests/worker/s),
#   - extra concurrency waits in the TCP accept queue → p99 latency rises,
#   - the Pi is protected from being driven into swap / thermal throttling.
#
# IMPORTANT TRADE-OFF (read before using):
#   `nexus_active_requests_inflight` (the dashboard's "queue depth") counts
#   requests that are ACTIVELY inside PHP. It can never exceed the number of
#   busy workers. So if you set MaxRequestWorkers = 24, queue depth maxes out
#   around 24 — you will NOT see queue depth climb to 100–150 this way.
#   Real worker-bounded queue depth and a "150-deep queue" visual are
#   mutually exclusive on a single Pi. Pick one:
#     • keep this cap  → honest, worker-bounded queue depth (small numbers)
#     • want 100–150   → use the scenario load-model overlay instead (see
#                        TUNING.md, "Tier 3"), which models queue depth from
#                        the scenario's intended user count.
#
# Plain prefork does NOT emit HTTP 503 on worker exhaustion — it queues.
# So this gives you throughput-cap + queue + latency, but NOT a 5xx error
# rate. For a real error rate see TUNING.md ("error rate" lever).
#
# Tune the numbers below to your Pi (a Pi 4 / 8GB tolerates more than a Pi
# Zero). Start conservative and watch CPU + memory on the dashboard.

<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers          8
    # Hard ceiling on concurrent worker processes. This is the main knob:
    # it caps both throughput and (worker-bounded) queue depth. 24 is a
    # reasonable starting point for a Pi 4; lower it for smaller boards.
    MaxRequestWorkers        24
    # Recycle workers periodically so a long soak test doesn't leak memory.
    MaxConnectionsPerChild   2000
</IfModule>

# Size the TCP accept backlog. When all workers are busy, this many
# connections wait (this is the "pressure" that turns into latency).
# Beyond it, new connections are refused — which Locust will surface as
# client-side failures during DDoS / Flash Crowd.
ListenBacklog 128
